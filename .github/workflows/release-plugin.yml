name: Release Plugin

on:
  push:
    tags:
      - "*/v*"

permissions:
  contents: write

jobs:
  parse-tag:
    name: Parse Tag
    runs-on: ubuntu-latest
    outputs:
      plugin_id: ${{ steps.parse.outputs.plugin_id }}
      version: ${{ steps.parse.outputs.version }}
    steps:
      - name: Parse plugin ID and version
        id: parse
        run: |
          TAG="${GITHUB_REF_NAME}"
          PLUGIN_ID="${TAG%%/*}"
          RAW_VERSION="${TAG##*/}"
          VERSION="${RAW_VERSION#v}"
          echo "plugin_id=${PLUGIN_ID}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building plugin '${PLUGIN_ID}' version '${VERSION}'"

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: parse-tag
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
          - goos: linux
            goarch: arm64
            runner: ubuntu-24.04-arm
          - goos: darwin
            goarch: arm64
            runner: macos-14
          - goos: windows
            goarch: amd64
            runner: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: plugins/${{ needs.parse-tag.outputs.plugin_id }}/go.mod
          cache: true

      # 构建 + 打包交给 release.go pack: 它按宿主 internal/pluginstore 的契约命名并自检,
      # 三处命名都由宿主定死, 改动会导致安装失败:
      # 资产名 = <id>_<version>_<goos>_<goarch>.zip (ArchiveName);
      # 包内只允许一个根级动态库, 名为 <id><扩展名> 或 <id>-v<version><扩展名>;
      # 校验文件必须叫 checksums.txt。
      # 用 Go 的 archive/zip 打包, 顺带避开 Windows 运行器没有 zip 命令的问题,
      # 各平台走同一条已验证的路径。
      # 平台必须由本机原生产出: c-shared 是 CGO 构建, 交叉编译需要目标平台 C 工具链,
      # 所以 --goos/--goarch 只用于对齐 CI 矩阵与本机平台, 不一致时直接失败。
      - name: Build and pack
        id: pack
        shell: bash
        env:
          PLUGIN_ID: ${{ needs.parse-tag.outputs.plugin_id }}
          VERSION: ${{ needs.parse-tag.outputs.version }}
          GOOS_NAME: ${{ matrix.goos }}
          GOARCH_NAME: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          if [ "${RUNNER_OS:-}" = "Windows" ]; then
            # windows 运行器把 MinGW 装在 C:\mingw64, 但不保证它在 PATH 最前, 而 cgo 需要 gcc
            export PATH="/c/mingw64/bin:$PATH"
          fi
          go run scripts/release.go pack \
            --plugin "${PLUGIN_ID}" \
            --version "${VERSION}" \
            --goos "${GOOS_NAME}" \
            --goarch "${GOARCH_NAME}" \
            --out dist
          asset="${PLUGIN_ID}_${VERSION}_${GOOS_NAME}_${GOARCH_NAME}.zip"
          test -f "dist/${asset}"
          echo "asset=${asset}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack.outputs.asset }}
          path: dist/${{ steps.pack.outputs.asset }}
          if-no-files-found: error

  release:
    name: Publish Release Assets
    needs: [parse-tag, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Generate checksums.txt
        run: |
          cd assets
          sha256sum *.zip > checksums.txt
          cat checksums.txt

      # 本仓是多插件 monorepo, tag 跨插件混排: GitHub 的 generate_release_notes
      # 只按「上一个 tag」比较, 会把别的插件的提交(乃至把上一个 tag 选成别的插件)
      # 写进本插件的 notes —— 实测 workbuddy 的 Full Changelog 指到了 trae/v0.1.1。
      # 改为自己按 plugins/<id> 路径过滤生成, 比较基准只取本插件的上一个 tag。
      - name: Generate release notes (plugin-scoped)
        id: notes
        env:
          PLUGIN_ID: ${{ needs.parse-tag.outputs.plugin_id }}
          VERSION: ${{ needs.parse-tag.outputs.version }}
        run: |
          current="${PLUGIN_ID}/v${VERSION}"
          prev="$(git tag -l "${PLUGIN_ID}/v*" --sort=-v:refname | grep -vx "${current}" | head -1 || true)"

          {
            echo "## ${PLUGIN_ID} v${VERSION}"
            echo
            if [ -n "${prev}" ]; then
              echo "上一版本: \`${prev}\`"
              range="${prev}..${current}"
            else
              echo "首个版本。"
              range="${current}"
            fi
            echo
            echo "### 变更"
            echo
            # 路径过滤是关键: 即使基准 tag 选错, 别的插件的提交也不会进来
            git log --pretty='- %s (%h)' "${range}" -- "plugins/${PLUGIN_ID}"
          } > release-notes.md
          cat release-notes.md
          echo "path=release-notes.md" >> "$GITHUB_OUTPUT"

      - name: Upload assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ needs.parse-tag.outputs.plugin_id }} v${{ needs.parse-tag.outputs.version }}
          body_path: ${{ steps.notes.outputs.path }}
          files: |
            assets/*.zip
            assets/checksums.txt

  record:
    name: Record Artifact Hashes
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-record-main
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: Download release assets and record hashes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          PLUGIN_ID="${TAG%%/*}"
          RAW_VERSION="${TAG##*/}"
          VERSION="${RAW_VERSION#v}"

          # record 本身幂等（回填存在的产物 + build-registry 全量重建），
          # 每次尝试基于最新 main 重新生成，push 被拒（并发回填）则重来
          for attempt in 1 2 3 4 5; do
            echo "== record 第 ${attempt}/5 次尝试 =="
            git fetch origin main
            git reset --hard origin/main
            rm -rf dist
            gh release download "${PLUGIN_ID}/v${VERSION}" --pattern '*.zip' --dir dist
            go run scripts/release.go record --plugin "${PLUGIN_ID}" --dist dist
            go run scripts/build-registry.go --check

            if git diff --quiet "plugins/${PLUGIN_ID}/plugin.json" registry.json; then
              echo "两个文件均无变化，跳过提交"
              exit 0
            fi

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add "plugins/${PLUGIN_ID}/plugin.json" registry.json
            git commit -m "chore(release): 回填 ${PLUGIN_ID} ${VERSION} 真实产物哈希"
            if git push origin main; then
              exit 0
            fi
            echo "[!] push 被拒(并发回填), 20s 后基于最新 main 重试"
            sleep 20
          done
          echo "record 重试 5 次仍失败" >&2
          exit 1
