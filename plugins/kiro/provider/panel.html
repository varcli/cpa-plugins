<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kiro 面板</title>
<style>
/* Theme tokens aligned with CPA management panel (key-policy / themes.scss):
   default :root = light (paper); data-theme=white | dark; embedded iframe syncs parent.
   Kiro shares the look-and-feel of the trae / qoder / workbuddy panels. */
:root{
  --bg:#faf9f5;--card:#ffffff;--border:#e3e1db;--fg:#2d2a26;--mut:#6d6760;
  --acc:#4c8dff;--on-acc:#ffffff;--ok:#10b981;--warn:#e0aa14;--err:#c65746;
  --surface:#f0eee8;--surface-muted:#e9e6df;--btn-sec:#eef1f6;--btn-sec-hover:#e4e8ef;
  --input-bg:#ffffff;--code-bg:#f3f4f6;--code-fg:#374151;--placeholder:rgba(109,103,96,.55);
  --ok-soft:rgba(16,185,129,.10);--ok-border:rgba(16,185,129,.30);
  --warn-soft:rgba(224,170,20,.12);--warn-border:rgba(224,170,20,.32);
  --err-soft:rgba(198,87,70,.10);--err-border:rgba(198,87,70,.30);
  --mut-soft:rgba(109,103,96,.12);--mut-border:rgba(109,103,96,.28);
  --scrim:rgba(45,42,38,.35);--toast-shadow:0 10px 28px rgba(0,0,0,.12),0 0 0 1px rgba(0,0,0,.04);
  --acc-ring:rgba(76,141,255,.18);--radius-md:12px;--radius-lg:16px;
  color-scheme:light
}
:root[data-theme="white"]{
  --bg:#f5f5f5;--card:#ffffff;--border:#e6e6e6;--fg:#1f1f1f;--mut:#707070;
  --surface:#fafafa;--surface-muted:#efefef;--btn-sec:#f0f0f0;--btn-sec-hover:#e8e8e8;
  --input-bg:#ffffff;--code-bg:#f3f4f6;--code-fg:#374151;--placeholder:rgba(112,112,112,.55);
  --scrim:rgba(0,0,0,.32);--toast-shadow:0 10px 28px rgba(0,0,0,.10),0 0 0 1px rgba(0,0,0,.04);
  color-scheme:light
}
:root[data-theme="dark"]{
  --bg:#1e1d1b;--card:#26241f;--border:#3a3833;--fg:#ede9e3;--mut:#9a948c;
  --acc:#4c8dff;--on-acc:#ffffff;--ok:#34d399;--warn:#f0c050;--err:#e07a6a;
  --surface:#2f2d28;--surface-muted:#35332e;--btn-sec:#35332e;--btn-sec-hover:#3f3c36;
  --input-bg:#1e1d1b;--code-bg:#35332e;--code-fg:#d6d1c9;--placeholder:rgba(154,148,140,.55);
  --ok-soft:rgba(52,211,153,.12);--ok-border:rgba(52,211,153,.38);
  --warn-soft:rgba(240,192,80,.14);--warn-border:rgba(240,192,80,.38);
  --err-soft:rgba(224,122,106,.12);--err-border:rgba(224,122,106,.38);
  --mut-soft:rgba(154,148,140,.16);--mut-border:rgba(154,148,140,.32);
  --scrim:rgba(0,0,0,.55);--toast-shadow:0 10px 28px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.03);
  --acc-ring:rgba(76,141,255,.28);
  color-scheme:dark
}
*{box-sizing:border-box}html{min-width:320px}
body{min-height:100vh;margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif}
/* 内容区域占满：不设 max-width 上限，改用参考布局的自适应内边距 */
.wrap{max-width:none;margin:0 auto;padding:clamp(24px,4vw,56px) clamp(16px,3vw,48px) 28px}
h1{font-size:clamp(24px,2vw,30px);line-height:1.12;letter-spacing:-.035em;margin:0 0 4px}
.sub{color:var(--mut);font-size:13px;margin-bottom:20px;max-width:720px}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
button{background:var(--acc);color:var(--on-acc);border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font-size:13px}
button.sec{background:var(--btn-sec);color:var(--fg)}button.sec:hover{background:var(--btn-sec-hover)}button:disabled{opacity:.5;cursor:default}
.toggle{display:flex;gap:8px;align-items:center;color:var(--mut);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px;align-items:start}
.card,.summary{background:var(--card);border:1px solid var(--border);border-radius:14px}
.card{padding:16px}
.card h2{font-size:15px;margin:0 0 2px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.uid{color:var(--mut);font-size:11px;font-family:ui-monospace,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:12px}
.badge{font-size:11px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--ok-soft);color:var(--ok);border:1px solid var(--ok-border)}
.badge.exhausted{background:var(--err-soft);color:var(--err);border:1px solid var(--err-border)}
.badge.builder{background:var(--acc-ring);color:var(--acc);border:1px solid var(--acc-ring)}
.badge.org{background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn-border)}
.badge.disabled{background:var(--mut-soft);color:var(--mut);border:1px solid var(--mut-border)}
.summary{padding:16px;margin-bottom:14px}
.summary-hd{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.summary-title{font-weight:700;font-size:14px}
.summary-meta{color:var(--mut);font-size:12px}
.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:10px}
.summary-item{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px}
.summary-item .k{color:var(--mut);font-size:11px;margin-bottom:4px}
.summary-item .v{font-size:18px;font-weight:700}
.summary-item .v.ok{color:var(--ok)}
.summary-item .v.warn{color:var(--warn)}
.summary-item .v.err{color:var(--err)}
.row{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-top:1px dashed var(--border)}
.row:first-of-type{border-top:0}.k{color:var(--mut)}.v{font-weight:600;text-align:right;word-break:break-all}
.v.ok{color:var(--ok)}.v.warn{color:var(--warn)}.v.err{color:var(--err)}
.pb{margin-top:10px}
.pb-label{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-bottom:6px}
.pb-track{height:8px;background:var(--surface-muted);border-radius:99px;overflow:hidden}
.pb-bar{height:100%;background:var(--ok);border-radius:99px;transition:width .6s ease}
.pb-meta{font-size:11px;color:var(--mut);margin-top:6px}
.actions{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}
.field-input{flex:1;background:var(--input-bg);border:1px solid var(--border);border-radius:8px;padding:8px 12px;color:var(--fg)}
.toasts{position:fixed;top:16px;right:16px;display:flex;flex-direction:column;gap:10px;z-index:9999;max-width:360px}
.toast{background:var(--card);border:1px solid var(--border);border-left:4px solid var(--acc);border-radius:var(--radius-md);padding:14px 18px;font-size:13px;box-shadow:var(--toast-shadow);transform:translateX(120%);opacity:0;transition:transform .3s cubic-bezier(.2,.9,.3,1.1),opacity .25s;cursor:pointer;word-break:break-all}
.toast.show{transform:translateX(0);opacity:1}
.toast.ok{border-left-color:var(--ok);background:var(--ok-soft)}
.toast.warn{border-left-color:var(--warn);background:var(--warn-soft)}
.toast.err{border-left-color:var(--err);background:var(--err-soft)}
.toast .t{font-weight:600;margin-bottom:3px}
.toast .d{color:var(--mut);font-size:12px;line-height:1.45}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--on-acc);border-top-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
button .spin{border-color:var(--on-acc);border-top-color:transparent}
.loading{color:var(--mut);text-align:center;padding:40px}
.code{background:var(--code-bg);color:var(--code-fg);border-radius:6px;padding:2px 6px;font-family:ui-monospace,monospace;font-size:12px}
</style>
<script>
/* Early theme sync (before body paint): mirror CPA parent data-theme when
   embedded; standalone falls back to prefers-color-scheme. Same semantics as
   the trae / qoder / workbuddy panels. */
(function(){
  var ATTR="data-theme";
  function embedded(){try{return window.self!==window.top}catch(e){return false}}
  function apply(t){
    var el=document.documentElement;
    if(t==="white"||t==="dark")el.setAttribute(ATTR,t);
    else el.removeAttribute(ATTR);
  }
  function parentTheme(){
    if(!embedded())return null;
    try{
      var raw=window.parent.document.documentElement.getAttribute(ATTR);
      if(raw==="white"||raw==="dark")return raw;
      return "light";
    }catch(e){return null}
  }
  function systemTheme(){
    try{return window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"}catch(e){return "light"}
  }
  function sync(){apply(parentTheme()||systemTheme())}
  sync();
  window.__kiroThemeSync=function(){
    sync();
    if(!embedded()){
      try{
        var mq=window.matchMedia("(prefers-color-scheme: dark)");
        var on=function(){sync()};
        if(mq.addEventListener)mq.addEventListener("change",on);
        else if(mq.addListener)mq.addListener(on);
      }catch(e){}
      return;
    }
    try{
      var parentEl=window.parent.document.documentElement;
      new MutationObserver(sync).observe(parentEl,{attributes:true,attributeFilter:[ATTR]});
      window.addEventListener("storage",function(e){if(e.key==="cli-proxy-theme")sync()});
    }catch(e){}
  };
})();
</script>
</head>
<body>
<div class="wrap">
  <h1>Kiro 账号面板</h1>
  <div class="sub">Kiro（AWS CodeWhisperer）· 账号用量与配额 · Builder ID / 组织（IAM Identity Center）· 桌面浏览器与 AWS SSO 设备码登录</div>
  <div id="authBox" class="card" style="display:none;margin-bottom:16px">
    <div style="margin-bottom:8px;color:var(--mut)">需要管理密钥（management key）才能访问账号数据。从 CPA 主面板嵌入时会自动获取，无需输入。错误密钥请勿连点，避免 IP 封禁。</div>
    <div style="display:flex;gap:8px">
      <input id="keyInput" type="password" placeholder="management key" class="field-input">
      <button onclick="saveKey()">连接</button>
    </div>
  </div>
  <div class="bar">
    <button id="refreshBtn" onclick="load(true,this)">刷新数据</button>
    <button class="sec" onclick="refreshQuota(this)" title="重新向上游查询 GetUsageLimits（不发送模型请求）">刷新配额</button>
    <button class="sec" onclick="loginStart(this)">新增 Kiro 账号</button>
    <span class="toggle" id="svtime"></span>
  </div>
  <div class="card" style="margin-bottom:16px">
    <div id="loginStatus" style="margin-bottom:6px;padding:6px 8px;border:1px solid rgba(128,128,128,.35);border-radius:6px;color:var(--mut);font-size:12px;line-height:1.5;word-break:break-all;max-height:9em;overflow-y:auto">登录状态：未开始</div>
    <div style="margin-bottom:6px;color:var(--mut)">浏览器登录完成后若停在「无法连接 127.0.0.1:&lt;端口&gt;」页面，把地址栏完整链接粘贴到此处提交即可完成登录（无需改写前缀）。设备码登录请直接访问上方给出的验证地址并输入用户码。</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <input id="cbPaste" type="text" placeholder="http://localhost:3128/signin/callback?code=…&amp;state=…" class="field-input" style="flex:1;min-width:240px">
      <button onclick="submitCallbackURL(this)">完成登录</button>
      <button class="sec" onclick="loginPoll(this)">检查状态</button>
    </div>
  </div>
  <div class="summary card" id="summaryBox" style="display:none"></div>
  <div id="grid" class="grid"><div class="loading">加载中…</div></div>
</div>
<div class="toasts" id="toasts"></div>
<script>
/* providerName: derived from URL (/v0/resource/plugins/<provider>/panel) so the
   same compiled panel.html works under any mount path. */
const providerName = (function(){
  const parts = window.location.pathname.split('/').filter(Boolean);
  if(parts.length>=4 && parts[0]==="v0" && parts[1]==="resource" && parts[2]==="plugins") return parts[3];
  if(parts.length>=2 && parts[0]==="plugins") return parts[1];
  return "kiro";
})();
const API = "/v0/management/plugins/" + providerName;

/* ---------- management key acquisition (3 fallbacks, zero config) ----------
   1) CPA main panel localStorage "cli-proxy-auth" (XOR+base64, same-origin
      iframe embed) — same approach as the trae / qoder / workbuddy panels.
   2) ?key= URL param (cleaned from history after read, kept in sessionStorage).
   3) Manual input (sessionStorage only, never persisted).
   The kiro plugin does not enforce a plugin-layer key, so the panel attempts
   every call with whatever key it has — the host CPA middleware is the actual
   guard. On 401 we surface the manual input box. */
const ENC_PREFIX = "enc::v1::";
const SECRET_SALT = "cli-proxy-api-webui::secure-storage";
const PANEL_STORE = "cli-proxy-auth";
const SS_KEY = providerName + "-mgmt-key";

function _enc(t){return new TextEncoder().encode(t)}
function _dec(b){return new TextDecoder().decode(b)}
function _keyBytes(){try{return _enc(SECRET_SALT+"|"+window.location.host+"|"+navigator.userAgent)}catch(e){return _enc(SECRET_SALT)}}
function _xor(d,k){const r=new Uint8Array(d.length);for(let i=0;i<d.length;i++)r[i]=d[i]^k[i%k.length];return r}
function _b64e(b){let s="";for(let i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return btoa(s)}
function _b64d(s){const bin=atob(s);const b=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)b[i]=bin.charCodeAt(i);return b}
function deobfuscate(p){if(!p||!p.startsWith(ENC_PREFIX))return p;try{return _dec(_xor(_b64d(p.slice(ENC_PREFIX.length)),_keyBytes()))}catch(e){return p}}
function isEmbedded(){try{return window.self!==window.top}catch(e){return false}}

function readPanelKey(){
  if(!isEmbedded())return null;
  let raw;try{raw=localStorage.getItem(PANEL_STORE)}catch(e){return null}
  if(!raw)return null;
  try{
    const parsed=JSON.parse(deobfuscate(raw));
    const st=(parsed&&parsed.state)||parsed||{};
    return typeof st.managementKey==="string"&&st.managementKey?st.managementKey:null;
  }catch(e){return null}
}
function readUrlKey(){
  const m=new URLSearchParams(window.location.search).get("key");
  if(m){history.replaceState(null,"",window.location.pathname)}
  return m;
}
function getKey(){
  return sessionStorage.getItem(SS_KEY)||readPanelKey()||readUrlKey();
}
function saveKey(){
  const v=document.getElementById("keyInput").value.trim();
  if(!v)return;
  sessionStorage.setItem(SS_KEY,v);
  document.getElementById("authBox").style.display="none";
  load(false);
}
function showAuth(){document.getElementById("authBox").style.display="block";const i=document.getElementById("keyInput");i&&i.focus()}
function authHeaders(k){return k?{"Authorization":"Bearer "+k}:{}}
/* --------------------------------------------------------------------------- */

function toast(title, kind="ok", detail=""){
  const box=document.getElementById("toasts");
  const el=document.createElement("div");
  el.className="toast "+kind;
  el.innerHTML='<div class="t"></div>'+(detail?'<div class="d"></div>':'');
  el.querySelector(".t").textContent=title;
  if(detail)el.querySelector(".d").textContent=detail;
  box.appendChild(el);
  requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add("show")));
  const kill=()=>{el.classList.remove("show");setTimeout(()=>el.remove(),300)};
  el.onclick=kill;
  setTimeout(kill, kind==="err"?6000:4000);
  while(box.children.length>5)box.firstChild.remove();
}
function busy(btn, on){
  if(!btn)return;
  if(on){btn.dataset.orig=btn.innerHTML;btn.disabled=true;btn.innerHTML='<span class="spin"></span>处理中…'}
  else{btn.disabled=false;if(btn.dataset.orig)btn.innerHTML=btn.dataset.orig}
}
function esc(s){return (s==null?"":String(s)).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function fmtWhen(ts){
  if(!ts)return "";
  const d=new Date(ts);
  if(isNaN(d.getTime()))return String(ts);
  return d.toLocaleString();
}
function fmtInt(n){
  const v=Number(n);
  if(!isFinite(v))return "--";
  return String(Math.round(v*100)/100);
}

/* ---------- API ---------- */
async function api(path, opts){
  const k=getKey();
  const init=Object.assign({headers:authHeaders(k)}, opts||{});
  const res=await fetch(API+path, init);
  if(res.status===401||res.status===403){showAuth();throw new Error("需要 management key")}
  const text=await res.text();
  let data=null;
  try{data=text?JSON.parse(text):null}catch(e){throw new Error("响应不是合法 JSON")}
  if(!res.ok)throw new Error((data&&(data.message||data.error))||("HTTP "+res.status));
  return data;
}

let accountCache=[];
let loginState="";

async function load(force, btn){
  if(btn)busy(btn,true);
  try{
    const data=await api("/quota"+(force?"?refresh=1":""));
    accountCache=(data&&data.accounts)||[];
    render(data);
  }catch(e){
    document.getElementById("grid").innerHTML='<div class="loading">加载失败：'+esc(e.message)+'</div>';
    toast("加载失败", "err", e.message);
  }finally{
    if(btn)busy(btn,false);
    document.getElementById("svtime").textContent="更新于 "+new Date().toLocaleTimeString();
  }
}

async function refreshQuota(btn){
  busy(btn,true);
  try{
    const data=await api("/quotaRequest",{method:"POST"});
    accountCache=(data&&data.accounts)||[];
    render(data);
    toast("配额已刷新", "ok", "共 "+accountCache.length+" 个账号");
  }catch(e){
    toast("刷新失败", "err", e.message);
  }finally{busy(btn,false)}
}

/* ---------- render ---------- */
function render(data){
  const accounts=(data&&data.accounts)||[];
  const grid=document.getElementById("grid");
  const summary=document.getElementById("summaryBox");
  if(!accounts.length){
    summary.style.display="none";
    grid.innerHTML='<div class="loading">暂无 Kiro 账号。点击「新增 Kiro 账号」登录，或用 <span class="code">--kiro-import</span> 导入已有凭证。</div>';
    return;
  }
  let ok=0, err=0, exhausted=0;
  accounts.forEach(a=>{ if(a.status==="ok")ok++; else err++; if(isExhausted(a))exhausted++; });
  summary.style.display="block";
  summary.innerHTML=
    '<div class="summary-hd"><span class="summary-title">总览</span>'+
    '<span class="summary-meta">'+(data&&data.generated_at?("快照 "+esc(fmtWhen(data.generated_at))):"")+'</span></div>'+
    '<div class="summary-grid">'+
      item("账号总数", accounts.length, "")+
      item("正常", ok, "ok")+
      item("异常", err, err?"err":"")+
      item("配额耗尽", exhausted, exhausted?"warn":"")+
    '</div>';
  grid.innerHTML=accounts.map(cardHTML).join("");
}
function item(k,v,cls){return '<div class="summary-item"><div class="k">'+esc(k)+'</div><div class="v '+(cls||"")+'">'+esc(v)+'</div></div>'}

function isExhausted(a){
  if(!a.quotas||!a.quotas.length)return false;
  return a.quotas.some(q=>!q.unlimited && Number(q.remaining)<=0);
}

function cardHTML(a){
  const exhausted=isExhausted(a);
  const kind=accountKind(a);
  const badge= exhausted ? '<span class="badge exhausted">配额耗尽</span>'
    : a.status==="ok" ? '<span class="badge">正常</span>'
    : '<span class="badge disabled">异常</span>';
  const kindBadge = kind==="org" ? '<span class="badge org">组织</span>'
    : kind==="builder" ? '<span class="badge builder">Builder ID</span>' : '';
  let body="";
  if(a.status!=="ok" && a.error){
    body='<div class="row"><span class="k">错误</span><span class="v err">'+esc(a.error)+'</span></div>';
  }else{
    if(a.plan)body+=row("计划", a.plan);
    if(a.subscription)body+=row("订阅", a.subscription);
    if(a.overage_status)body+=row("超额", a.overage_status);
    if(a.next_reset)body+=row("重置时间", fmtWhen(a.next_reset));
    (a.usage||[]).forEach(u=>{ body+=usageHTML(u) });
    if(!a.usage||!a.usage.length){
      (a.quotas||[]).forEach(q=>{ body+=quotaHTML(q) });
    }
  }
  return '<div class="card"><h2>'+esc(a.label||a.name||"Kiro 账号")+' '+badge+kindBadge+'</h2>'+
    '<div class="uid">'+esc(a.auth_index||"")+'</div>'+body+
    '<div class="actions">'+
      '<button class="sec" onclick="relogin(\''+esc(a.auth_index)+'\',this)">重新登录</button>'+
    '</div></div>';
}
function row(k,v,cls){return '<div class="row"><span class="k">'+esc(k)+'</span><span class="v '+(cls||"")+'">'+esc(v)+'</span></div>'}

function usageHTML(u){
  const pct=Math.max(0,Math.min(100,Number(u.usage_percent)||0));
  const color=pct>85?"var(--err)":(pct>60?"var(--warn)":"var(--ok)");
  const unit=u.unit||"";
  return '<div class="pb"><div class="pb-label"><span>'+esc(u.display_name||u.resource_type||"用量")+'</span><span>'+esc(fmtInt(pct))+'%</span></div>'+
    '<div class="pb-track"><div class="pb-bar" style="width:'+pct+'%;background:'+color+'"></div></div>'+
    '<div class="pb-meta">已用 '+esc(fmtInt(u.current_usage))+' / '+esc(fmtInt(u.usage_limit))+' '+esc(unit)+' · 剩余 '+esc(fmtInt(u.remaining))+
      (u.next_reset?(" · 重置 "+esc(fmtWhen(u.next_reset))):"")+'</div></div>';
}
function quotaHTML(q){
  const unlimited=!!q.unlimited;
  const pct=unlimited?0:Math.max(0,Math.min(100,100-(Number(q.remaining)||0)));
  return '<div class="pb"><div class="pb-label"><span>'+esc(q.name||"配额")+'</span><span>'+(unlimited?"无限":esc(fmtInt(q.remaining))+" "+(q.unit||""))+'</span></div>'+
    '<div class="pb-track"><div class="pb-bar" style="width:'+pct+'%"></div></div></div>';
}
function accountKind(a){
  const region=String(a.sso_region||"").toLowerCase();
  if(a.subscription_type && /idc|identity|organization/i.test(String(a.subscription_type)))return "org";
  if(/builder/i.test(String(a.label||"")+String(a.name||"")))return "builder";
  return "";
}

/* ---------- OAuth login ---------- */
async function loginStart(btn){
  busy(btn,true);
  try{
    const data=await api("/oauth/login/start",{method:"POST",headers:Object.assign({"Content-Type":"application/json"},authHeaders(getKey())),body:"{}"});
    loginState=(data&&data.state)||"";
    const url=(data&&data.url)||"";
    setLoginStatus("登录已开始 · state="+loginState, url);
    if(url){ try{window.open(url,"_blank","noopener")}catch(e){} }
    toast("登录已开始", "ok", url?("已在新标签页打开授权页；若被拦截请手动复制地址"):"");
    pollLoop();
  }catch(e){
    toast("无法开始登录", "err", e.message);
  }finally{busy(btn,false)}
}
async function loginPoll(btn){
  if(btn)busy(btn,true);
  try{
    const data=await api("/oauth/login/status?state="+encodeURIComponent(loginState));
    handleLoginResult(data);
  }catch(e){
    toast("查询失败", "err", e.message);
  }finally{if(btn)busy(btn,false)}
}
async function submitCallbackURL(btn){
  const v=document.getElementById("cbPaste").value.trim();
  if(!v){toast("请粘贴回调链接", "warn");return}
  if(!loginState){toast("请先点击「新增 Kiro 账号」", "warn");return}
  busy(btn,true);
  try{
    const data=await api("/oauth/login/status?state="+encodeURIComponent(loginState),{
      method:"POST",
      headers:Object.assign({"Content-Type":"application/json"},authHeaders(getKey())),
      body:JSON.stringify({callback_url:v})
    });
    handleLoginResult(data);
    if(data&&data.status==="success")document.getElementById("cbPaste").value="";
  }catch(e){
    toast("提交失败", "err", e.message);
  }finally{busy(btn,false)}
}
function handleLoginResult(data){
  const status=(data&&data.status)||"";
  if(status==="success"){
    setLoginStatus("登录成功，账号已保存","");
    toast("登录成功", "ok");
    loginState="";
    load(false);
  }else if(status==="error"){
    setLoginStatus("登录失败："+((data&&data.message)||"未知错误"),"");
    toast("登录失败", "err", (data&&data.message)||"");
    loginState="";
  }else{
    setLoginStatus("等待授权…（"+esc(status||"pending")+"）","");
  }
}
let pollTimer=null;
function pollLoop(){
  if(pollTimer)clearInterval(pollTimer);
  pollTimer=setInterval(async()=>{
    if(!loginState){clearInterval(pollTimer);pollTimer=null;return}
    try{
      const data=await api("/oauth/login/status?state="+encodeURIComponent(loginState));
      handleLoginResult(data);
    }catch(e){/* keep polling; transient */}
  },3000);
}
function setLoginStatus(text, url){
  const el=document.getElementById("loginStatus");
  el.textContent="登录状态："+text+(url?("　授权地址："+url):"");
}

/* ---------- relogin ---------- */
async function relogin(authIndex, btn){
  busy(btn,true);
  try{
    const data=await api("/oauth/relogin/start",{
      method:"POST",
      headers:Object.assign({"Content-Type":"application/json"},authHeaders(getKey())),
      body:JSON.stringify({auth_index:authIndex})
    });
    loginState=(data&&data.state)||"";
    const url=(data&&data.url)||"";
    setLoginStatus("重新登录已开始 · state="+loginState, url);
    if(url){ try{window.open(url,"_blank","noopener")}catch(e){} }
    toast("重新登录已开始", "ok", "授权完成后回到本页检查状态");
    pollLoop();
  }catch(e){
    toast("重新登录失败", "err", e.message);
  }finally{busy(btn,false)}
}

load(false);
</script>
